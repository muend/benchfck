name: Property 10k

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "41 2 * * 0"

permissions:
  contents: read

concurrency:
  group: property-10k-${{ github.ref }}
  cancel-in-progress: false

jobs:
  property-10k:
    name: Property / 10k shard ${{ matrix.shard_index }} of 4
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard_index: [0, 1, 2, 3]
    env:
      BENCHFCK_PROPERTY_SHARD_INDEX: ${{ matrix.shard_index }}
      BENCHFCK_PROPERTY_SHARD_COUNT: 4
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - name: Run deterministic release-population shard
        timeout-minutes: 3
        run: >-
          cargo test --release --locked --test property_10k
          ci_release_shard_from_environment
          -- --ignored --exact --nocapture
