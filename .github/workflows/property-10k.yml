name: Property 10k

on:
  workflow_dispatch:
  schedule:
    - cron: "41 2 * * 0"

permissions:
  contents: read

concurrency:
  group: property-10k-${{ github.ref }}
  cancel-in-progress: false

jobs:
  property-10k:
    name: Property / 10k exhaustive shard
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - name: Run the ignored 10k release shard
        run: >-
          cargo test --release --locked --test property_10k
          ten_thousand_ir_programs_match_every_backend_over_the_full_domain
          -- --ignored --exact --nocapture
