# PENDING DECISION: v1 conditionals intentionally have no `else` arm.
if_without_else = true
# D52: v0.4 release evidence is arity-1 only. Arity-2 remains available to
# diagnostic/library callers that deliberately load a separate max_arity=2
# configuration, but it is not admissible to the v0.4 evidence path.
max_arity = 1
# PENDING DECISION: three generation layouts plus one held-out layout.
layout_disciplines = 4
held_out_layout = "held_out"
# PENDING DECISION: target number of equivalent compiler strategies.
templates_per_statement = 3
# PENDING DECISION: post-obfuscation mutation sensitivity threshold.
avalanche_threshold = 0.60
# PENDING DECISION: T1 asks for interior probes.
trace_demand = "probe_based"
# PENDING DECISION: pointer volatility is measured, not generated directly.
pointer_volatility_as_covariate = true
# PENDING DECISION: executions beyond this are NON_TERMINATING.
# F16: 600 production-schedule candidates measured max 255-input E0 runtime
# 5,678,676 at tier 9. 8M leaves 40.9% margin and is pinned in every prompt.
step_cap = 8000000
# Large programs may sample positions, but never fewer than this.
minimum_avalanche_positions = 64
# Canonical-idiom matches divided by BF length must remain below this value.
off_idiom_threshold = 0.08
# RLE is the accepted benchmark representation. Expanded and omitted remain
# available through the library for the movement-channel diagnostic pilot.
move_carrier = "rle"
# Executed E0 steps that are not pointer movement must meet this floor.
minimum_trace_semantic_density = 0.30
# D32: source-text semantic density has NO floor. It decays monotonically with
# program size (0.46 at tier 0 to 0.076 at tier 7), so any floor selects on
# length; a 0.35 floor admitted only tiers 0-1, whose E0 token range is disjoint
# from the E2 range, leaving the encoding effect unidentified by any method. The
# value is recorded per item and is a required control in size-tier analysis.
# D28: neither E2/E0 nor E3/E0 is an acceptance gate. Both prompt-BPE ratios are
# recorded as mandatory covariates and the H1 contrast is measured on
# preregistered token-matched pairs (D15), which control the confound rather
# than shrinking it. A ratio ceiling here would also silently bias the accepted
# population against the larger size tiers.
prompt_tokenizer = "cl100k_base"
# Static exports contain several deterministic interior probes per encoding.
t1_probe_count = 3
# Fold constant-only subexpressions, then apply this restricted-grammar EXPR
# threshold (`inputs[N]` and `//` are each one token). The full T2 response has
# a separate safety cap below.
t2_nontriviality_threshold = 25
# Hybrid nontriviality layer 1: attempt exact enumeration through depth 7, but
# report and accept only the depth actually exhausted. Layer 2 supplies named
# analytical family exclusions; no claim is made beyond the proven depth.
t2_enumerator_target_ast_depth = 7
t2_enumerator_min_proven_ast_depth = 3
t2_enumerator_max_semantics = 1000000
t2_enumerator_max_operator_applications = 1000000
# Hybrid layer 2 has no independently selected family thresholds. Its scan
# bounds are derived from t2_nontriviality_threshold, and a family rejects only
# when it synthesizes a parser-valid witness below that same folded-token bound.
# Absolute safety ceiling. Each item gets one T2 cap shared by E0/E1/E2/E3;
# item difficulty features create variation across a batch.
t2_token_cap = 384
# T3 likewise has one item-level cap shared by all encodings.
t3_token_cap = 96
